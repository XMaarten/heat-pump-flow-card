name: Delete merged branches

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch if no new commits exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$BRANCH" != "main" ] || exit 0
          if ! gh api "repos/$REPO/branches/$BRANCH" >/dev/null 2>&1; then
            echo "Branch already deleted"
            exit 0
          fi
          unmerged="$(gh api "repos/$REPO/compare/$BRANCH...main" --jq '.behind_by')"
          if [ "$unmerged" != "0" ]; then
            echo "Keeping $BRANCH: contains new commits"
            exit 0
          fi
          gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "Deleted $BRANCH"
